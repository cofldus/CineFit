name: CI

on:
  push:
    branches: [main]
  pull_request:

# 실제 KOBIS 키 없이 통과해야 한다 — 외부 API 실호출은 기본 게이트에 포함하지 않는다.
# (실호출 점검은 수동 실행 워크플로 kobis-sync-check.yml 참고)
jobs:
  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 전체 이력 검사
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    name: lint · typecheck · migration · unit test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # node:sqlite 내장 모듈 필요
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:seed # 시드 + 마이그레이션
      - run: npm run db:migrate # 재실행 멱등성 검증
      - run: npm test # KOBIS fixture·통합·관리자 API 포함 (외부 호출 없음)
      - run: npm run build

  e2e:
    name: Playwright E2E + visual regression (admin + user flow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # DB는 global-setup이 test-results/e2e.db로 격리 생성. e2e/visual.spec.ts는 CI와 동일한
      # 리눅스 컨테이너(mcr.microsoft.com/playwright)에서 만든 -linux.png 베이스라인과 비교한다
      # (docs/TESTING.md — 로컬 OS에서 생성한 스크린샷은 폰트 렌더링 차이로 여기서 항상 실패한다).
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
