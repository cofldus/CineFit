name: CI

on:
  push:
    branches: [main]
  pull_request:

# 실제 KOBIS 키 없이 통과해야 한다 — 외부 API 실호출은 기본 게이트에 포함하지 않는다.
# (실호출 점검은 수동 실행 워크플로 kobis-sync-check.yml 참고)
jobs:
  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 전체 이력 검사
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    name: lint · typecheck · migration · unit test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # node:sqlite 내장 모듈 필요
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:seed # 시드 + 마이그레이션
      - run: npm run db:migrate # 재실행 멱등성 검증
      - run: npm test # KOBIS fixture·통합·관리자 API 포함 (외부 호출 없음)
      - run: npm run build

  e2e:
    name: Playwright E2E + visual regression (admin + user flow)
    runs-on: ubuntu-latest
    # 반드시 베이스라인을 생성한 것과 완전히 동일한 이미지 안에서 실행한다 — 이전에는
    # ubuntu-latest 러너에서 npx playwright install --with-deps만 했는데, 러너 기본 이미지의
    # 폰트 세트가 이 컨테이너와 달라 텍스트 줄바꿈·페이지 높이가 달라지고 시각 회귀 테스트가
    # 구조적으로(픽셀 노이즈가 아니라 이미지 크기 자체가) 계속 실패했다(2026-07-28, docs/TESTING.md §5).
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build
      # DB는 global-setup이 test-results/e2e.db로 격리 생성. e2e/visual.spec.ts는 이 컨테이너에서
      # 만든 -linux.png 베이스라인과 비교한다(docs/TESTING.md).
      - run: npx playwright test
      # R21.1 §6: 실패 시 원인 특정 재료 보존 — HTML report + trace/screenshot/video가 담긴
      # test-results/. (동일 테스트가 반복 실패하면 이 아티팩트의 trace를 playwright show-trace로
      # 연다. 전체 잡 retry는 의도적으로 없다 — 플레이크를 가리지 않는다.)
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
